name: Build Rock Merchant QQ releases

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rock-merchant-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - name: Validate Linux systemd unit files
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python - <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          from desktop_app import linux_units
          root = Path.cwd()
          directory = Path(os.environ['RUNNER_TEMP']) / 'merchant systemd check'
          directory.mkdir(parents=True, exist_ok=True)
          service, timer = linux_units(root, root / 'config.json', Path(sys.executable), root / 'desktop_app.py')
          service_path = directory / 'merchant-check.service'
          timer_path = directory / 'merchant-check.timer'
          service_path.write_text(service)
          timer_path.write_text(timer)
          subprocess.run(['sudo', 'systemd-analyze', 'verify', str(service_path), str(timer_path)], check=True)
          PY
      - run: python build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: rock-merchant-${{ matrix.os }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-files
      - name: Publish Windows, Linux and source downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          version=$(cat VERSION | tr -d '\r\n')
          tag="rock-merchant-qq-v${version}"
          mkdir -p release-upload
          cp release-files/rock-merchant-windows-latest/*windows-x64.zip release-upload/
          cp release-files/rock-merchant-ubuntu-22.04/*linux-x86_64.zip release-upload/
          cp release-files/rock-merchant-ubuntu-22.04/*source.zip release-upload/
          (cd release-upload && sha256sum *.zip > SHA256SUMS.txt)
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "远行商人 QQ 提醒 v${version}" --notes-file release-notes.md --latest
          fi
          gh release upload "$tag" release-upload/* --clobber
